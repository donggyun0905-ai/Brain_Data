# Data Brain 실행 구성
#   core  : 항상 켬 (약 9GB)   docker compose --profile core up -d
#   batch : 야간 작업 때 (약 8GB) docker compose --profile core --profile batch up -d
#   view  : 화면 개발·데모 때 (약 3GB)
#
# 주의: 이미지 버전은 2026-10 기준으로 적었지만 이 저장소를 만든 환경에서는 실제로 받아보지 못했다.
#       1주차에 `docker compose pull`로 존재 여부를 확인하고, 없으면 가까운 버전으로 고정할 것 (docs/week1.md).

x-app: &app
  build: { context: ., dockerfile: infra/app/Dockerfile }
  environment:
    BOOTSTRAP: kafka:9092
  volumes:
    - ./data:/app/data
  depends_on: [kafka]

services:
  # ---------------- core ----------------
  kafka:
    image: apache/kafka:4.1.0
    profiles: [core]
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168          # 7일. 수면 재생 원본은 Parquet 보관본에서 읽음
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    mem_limit: 1500m

  kafka-init:
    image: apache/kafka:4.1.0
    profiles: [core]
    depends_on: [kafka]
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    volumes: ["./infra/kafka:/scripts:ro"]

  jobmanager:
    build: { context: ., dockerfile: infra/flink/Dockerfile }
    profiles: [core]
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes: ["./src:/opt/databrain/src:ro"]
    mem_limit: 1500m

  taskmanager:
    build: { context: ., dockerfile: infra/flink/Dockerfile }
    profiles: [core]
    command: taskmanager
    depends_on: [jobmanager]
    deploy: { replicas: 2 }
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2g
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes: ["./src:/opt/databrain/src:ro"]
    mem_limit: 2500m

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: [core]
    ports: ["8123:8123"]
    environment:
      CLICKHOUSE_USER: databrain
      CLICKHOUSE_PASSWORD: databrain
    volumes: ["./infra/clickhouse:/docker-entrypoint-initdb.d:ro"]
    mem_limit: 2g

  controller:
    <<: *app
    profiles: [core]
    command: ["python", "-m", "databrain.controller.main", "--bootstrap", "kafka:9092", "--capacity", "${CAPACITY_EPS:-10000}"]

  replayer:                     # 상시 실행 아님: docker compose run --rm replayer <경로> --speed 100
    <<: *app
    profiles: [tools]
    entrypoint: ["python", "-m", "databrain.replayer.main", "--bootstrap", "kafka:9092"]

  kafka-exporter:               # 화면용 밀림 지표 (제어기는 Kafka에서 직접 읽음, ADR-0002)
    image: danielqsj/kafka-exporter:v1.9.0
    profiles: [core]
    command: ["--kafka.server=kafka:9092"]
    depends_on: [kafka]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [core]
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [core]
    ports: ["3000:3000"]
    mem_limit: 512m

  # ---------------- batch ----------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # 공식 이미지 배포 정책이 바뀌었을 수 있음. 1주차 확인
    profiles: [batch]
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment: { MINIO_ROOT_USER: databrain, MINIO_ROOT_PASSWORD: databrain123 }
    mem_limit: 1g

  spark:
    image: apache/spark:4.0.0
    profiles: [batch]
    command: ["sleep", "infinity"]           # 작업은 Airflow 또는 docker compose exec로 제출
    volumes: ["./src:/opt/databrain/src:ro", "./data:/opt/databrain/data"]
    mem_limit: 4g

  airflow:
    image: apache/airflow:3.0.6
    profiles: [batch]
    command: standalone
    ports: ["8080:8080"]
    mem_limit: 3g

  # ---------------- view ----------------
  superset:
    image: apache/superset:5.0.0
    profiles: [view]
    ports: ["8088:8088"]
    environment: { SUPERSET_SECRET_KEY: change-me }
    mem_limit: 1500m
