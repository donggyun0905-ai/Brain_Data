# Data Brain 실행 구성
#   core  : 항상 켬 (약 9GB)   docker compose --profile core up -d
#   batch : 야간 작업 때 (약 8GB) docker compose --profile core --profile batch up -d
#   view  : 화면 개발·데모 때 (약 3GB)
#
# 이미지 태그는 2026-10-17에 모두 존재 확인 (docs/week1.md). MinIO만 batch 단계 전에 다시 확인.
# 개발 PC에서는 docker-compose.local.yml을 겹쳐 쓴다 (ADR-0006).

x-app: &app
  build: { context: ., dockerfile: infra/app/Dockerfile }
  environment:
    BOOTSTRAP: kafka:9092
  volumes:
    - ./data:/app/data
  depends_on: [kafka]

services:
  # ---------------- core ----------------
  kafka:
    image: apache/kafka:4.1.0
    profiles: [core]
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168          # 7일. 수면 재생 원본은 Parquet 보관본에서 읽음
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:                            # 컨테이너 시작 ≠ 접속 가능. 준비된 뒤에 다른 서비스를 띄운다
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    mem_limit: 1500m

  kafka-init:
    image: apache/kafka:4.1.0
    profiles: [core]
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    volumes: ["./infra/kafka:/scripts:ro"]

  jobmanager:
    build: { context: ., dockerfile: infra/flink/Dockerfile }
    profiles: [core]
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      # 이미지 기본 메모리 1600m는 mem_limit 1500m를 넘어서 1200m로 줄임 (2026-10-17 확인)
      # 지표 모으는 주기 1초: 제어기가 REST로 처리 위치를 읽는다 (기본 10초, ADR-0008)
      # 주의: 아래 블록 안에는 '#' 주석을 쓰면 안 된다. Flink가 값의 일부로 읽어 시작에 실패함 (2026-10-17 확인)
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1200m
        metrics.fetcher.update-interval: 1s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes: ["./src:/opt/databrain/src:ro"]
    mem_limit: 1500m

  taskmanager:
    build: { context: ., dockerfile: infra/flink/Dockerfile }
    profiles: [core]
    command: taskmanager
    depends_on: [jobmanager]
    deploy: { replicas: 2 }
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2g
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes: ["./src:/opt/databrain/src:ro"]
    mem_limit: 2500m

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: [core]
    ports: ["8123:8123"]
    environment:
      CLICKHOUSE_USER: databrain
      CLICKHOUSE_PASSWORD: databrain
    volumes: ["./infra/clickhouse:/docker-entrypoint-initdb.d:ro"]
    mem_limit: 2g

  controller:
    <<: *app
    profiles: [core]
    depends_on: { kafka-init: { condition: service_completed_successfully } }   # 토픽이 생긴 뒤 시작
    restart: unless-stopped
    command: ["python", "-m", "databrain.controller.main", "--bootstrap", "kafka:9092", "--flink-rest", "http://jobmanager:8081",
              "--capacity", "${CAPACITY_EPS:-10000}"]

  replayer:                     # 상시 실행 아님: docker compose run --rm replayer <경로> --speed 100
    <<: *app
    profiles: [tools]
    entrypoint: ["python", "-m", "databrain.replayer.main", "--bootstrap", "kafka:9092"]

  kafka-exporter:               # 화면용 밀림 지표 (제어기는 Kafka에서 직접 읽음, ADR-0002)
    image: danielqsj/kafka-exporter:v1.9.0
    profiles: [core]
    command: ["--kafka.server=kafka:9092"]
    depends_on: [kafka]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [core]
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [core]
    ports: ["3000:3000"]
    mem_limit: 512m

  # ---------------- batch ----------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # 공식 이미지 배포 정책이 바뀌었을 수 있음. 1주차 확인
    profiles: [batch]
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment: { MINIO_ROOT_USER: databrain, MINIO_ROOT_PASSWORD: databrain123 }
    mem_limit: 1g

  spark:
    image: apache/spark:4.0.0
    profiles: [batch]
    command: ["sleep", "infinity"]           # 작업은 Airflow 또는 docker compose exec로 제출
    volumes: ["./src:/opt/databrain/src:ro", "./data:/opt/databrain/data"]
    mem_limit: 4g

  airflow:
    image: apache/airflow:3.0.6
    profiles: [batch]
    command: standalone
    ports: ["8080:8080"]
    mem_limit: 3g

  # ---------------- view ----------------
  superset:
    image: apache/superset:5.0.0
    profiles: [view]
    ports: ["8088:8088"]
    environment: { SUPERSET_SECRET_KEY: change-me }
    mem_limit: 1500m
